services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      LINT_FIX_WATCH: "true"
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: ./assets
          target: /app/assets
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync+restart
          path: ./dev/proxies.json
          target: /app/dev/proxies.json
        - action: sync+restart
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./tests
          target: /app/tests
        - action: sync
          path: ./.eslintrc.yml
          target: /app/.eslintrc.yml
        - action: sync
          path: ./.prettierrc
          target: /app/.prettierrc
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./patches
